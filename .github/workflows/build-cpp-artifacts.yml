name: Build C++ bindings and tools

on:
  push:
    branches:
      - develop-cpp-fii

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  windows-x64:
    runs-on: windows-2022
    env:
      VCPKGRS_DYNAMIC: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Show build environment
        shell: pwsh
        run: |
          rustup show
          cargo --version
          rustc --version --verbose
          Get-Command cl | Select-Object -ExpandProperty Source
      - name: Build all workspace targets with detailed output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          cargo build --workspace --release --locked 2>&1 | Tee-Object -FilePath logs/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run FFI and CLI tests
        shell: pwsh
        run: |
          cargo test -p probe-rs-lib -p probe-rs-lib-cli --locked 2>&1 | Tee-Object -FilePath logs/test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p probe-rs --lib validate_builtin --locked 2>&1 | Tee-Object -FilePath logs/test.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package C++ library and tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path @('package/include', 'package/bin', 'package/lib', 'tools') | Out-Null
          Copy-Item probe-rs-lib/include/probe_rs_lib.h package/include/
          Copy-Item target/release/probe_rs_lib.dll package/bin/
          Copy-Item target/release/probe-rs-lib-cli.exe package/bin/
          if (-not (Test-Path target/release/probe_rs_lib.dll.lib)) { throw 'MSVC DLL import library is missing' }
          if (-not (Test-Path target/release/probe_rs_lib.lib)) { throw 'MSVC static library is missing' }
          Copy-Item target/release/probe_rs_lib.dll.lib package/lib/probe_rs_lib.lib
          Copy-Item target/release/probe_rs_lib.lib package/lib/probe_rs_lib_static.lib
          foreach ($name in @('probe-rs', 'cargo-flash', 'cargo-embed', 'target-gen', 'xtask')) {
            Copy-Item "target/release/$name.exe" tools/
          }
          Get-ChildItem -Recurse package, tools | Select-Object FullName, Length
      - name: Compile and run C++ linkage smoke test
        shell: pwsh
        run: |
          cl /nologo /EHsc /std:c++17 /Ipackage/include probe-rs-lib/tests/ffi_smoke.cpp /link /LIBPATH:package/lib probe_rs_lib.lib /OUT:package/bin/ffi_smoke.exe 2>&1 | Tee-Object -FilePath logs/smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$(Resolve-Path package/bin);$env:PATH"
          & ./package/bin/ffi_smoke.exe 2>&1 | Tee-Object -FilePath logs/smoke.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./package/bin/probe-rs-lib-cli.exe --op spec --chip nrf51822_Xxaa --programmer-type cmsis-dap 2>&1 | Tee-Object -FilePath logs/smoke.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and run C++ static linkage smoke test
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
        run: |
          cargo rustc -p probe-rs-lib --release --locked --lib -- --print native-static-libs 2>&1 | Tee-Object -FilePath logs/static-link.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nativeLine = Get-Content logs/static-link.log | Select-String 'native-static-libs:' | Select-Object -Last 1
          if (-not $nativeLine) { throw 'Missing native-static-libs output' }
          $plainLine = $nativeLine.Line -replace '\x1B\[[0-9;]*[A-Za-z]', ''
          $nativeArgs = (($plainLine -split 'native-static-libs:\s*', 2)[1]).Trim() -split '\s+'
          if (-not $nativeArgs -or @($nativeArgs | Where-Object { $_ -notmatch '^(?:[^\s]+\.lib|/defaultlib:[^\s]+)$' }).Count -gt 0) {
            throw "Unexpected native-static-libs arguments: $($nativeArgs -join ' ')"
          }
          $nativeArgsOriginal = $nativeArgs -join ' '
          $registrySrc = if ($env:CARGO_HOME) { Join-Path $env:CARGO_HOME 'registry/src' } else { Join-Path $env:USERPROFILE '.cargo/registry/src' }
          if (-not (Test-Path -LiteralPath $registrySrc)) { throw "Cargo registry sources not found: $registrySrc" }
          New-Item -ItemType Directory -Force -Path package/lib/native | Out-Null
          for ($i = 0; $i -lt $nativeArgs.Count; $i++) {
            if ($nativeArgs[$i] -match '^windows\.(\d+\.\d+\.\d+)\.lib$') {
              $name = $nativeArgs[$i]
              $candidates = @(Get-ChildItem -LiteralPath $registrySrc -Directory | ForEach-Object {
                Get-ChildItem -LiteralPath $_.FullName -Directory -Filter 'windows_x86_64_msvc-*'
              } | ForEach-Object {
                Join-Path $_.FullName "lib/$name"
              } | Where-Object { Test-Path -LiteralPath $_ })
              if ($candidates.Count -ne 1) { throw "Expected one Cargo registry copy of $name, found $($candidates.Count) under $registrySrc" }
              $packaged = Join-Path (Resolve-Path package/lib/native).Path $name
              Copy-Item -LiteralPath $candidates[0] -Destination $packaged -Force
              "Resolved $name from $($candidates[0]) to $packaged" | Tee-Object -FilePath logs/static-link.log -Append
              $nativeArgs[$i] = $packaged
            }
          }
          $nativeArgsOriginal | Set-Content package/lib/native-static-libs.txt
          New-Item -ItemType Directory -Force -Path static-smoke | Out-Null
          $archive = (Resolve-Path package/lib/probe_rs_lib_static.lib).Path
          "Static link inputs: $archive $($nativeArgs -join ' ')" | Tee-Object -FilePath logs/static-link.log -Append
          cl /nologo /EHsc /std:c++17 /MD /Ipackage/include probe-rs-lib/tests/ffi_smoke.cpp /link /WX $archive $nativeArgs /OUT:static-smoke/ffi_smoke_static.exe 2>&1 | Tee-Object -FilePath logs/static-link.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $imports = dumpbin /dependents static-smoke/ffi_smoke_static.exe 2>&1 | Tee-Object -FilePath logs/static-link.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($imports -match 'probe_rs_lib\.dll') { throw 'Static smoke test still imports probe_rs_lib.dll' }
          & ./static-smoke/ffi_smoke_static.exe 2>&1 | Tee-Object -FilePath logs/static-link.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive Windows artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path package/* -DestinationPath cpp-windows-x64.zip
          Compress-Archive -Path tools/* -DestinationPath tools-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: cpp-windows-x64
          path: cpp-windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: tools-windows-x64
          path: tools-windows-x64.zip
          if-no-files-found: error
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-windows-x64
          path: logs/
          if-no-files-found: ignore

  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Show build environment
        run: |
          rustup show
          cargo --version
          rustc --version --verbose
          c++ --version
          uname -a
      - name: Build all workspace targets with detailed output
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          cargo build --workspace --release --locked 2>&1 | tee logs/build.log
      - name: Run FFI and CLI tests
        shell: bash
        run: |
          set -o pipefail
          cargo test -p probe-rs-lib -p probe-rs-lib-cli --locked 2>&1 | tee logs/test.log
          cargo test -p probe-rs --lib validate_builtin --locked 2>&1 | tee -a logs/test.log
      - name: Package C++ library and tools
        shell: bash
        run: |
          mkdir -p package/include package/bin package/lib tools
          cp probe-rs-lib/include/probe_rs_lib.h package/include/
          cp target/release/libprobe_rs_lib.dylib package/bin/
          cp target/release/libprobe_rs_lib.a package/lib/
          cp target/release/probe-rs-lib-cli package/bin/
          for name in probe-rs cargo-flash cargo-embed target-gen xtask; do
            cp "target/release/$name" tools/
          done
          find package tools -type f -print
      - name: Compile and run C++ linkage smoke test
        shell: bash
        run: |
          set -o pipefail
          c++ -std=c++17 -Ipackage/include probe-rs-lib/tests/ffi_smoke.cpp -Lpackage/bin -lprobe_rs_lib -Wl,-rpath,@loader_path -o package/bin/ffi_smoke 2>&1 | tee logs/smoke.log
          ./package/bin/ffi_smoke 2>&1 | tee -a logs/smoke.log
          ./package/bin/probe-rs-lib-cli --op spec --chip nrf51822_Xxaa --programmer-type cmsis-dap 2>&1 | tee -a logs/smoke.log
      - name: Compile and run C++ static linkage smoke test
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          cargo rustc -p probe-rs-lib --release --locked --lib -- --print native-static-libs 2>&1 | tee logs/static-link.log
          native_line=$(grep 'native-static-libs:' logs/static-link.log | tail -n 1)
          test -n "$native_line"
          native_line=$(printf '%s' "$native_line" | sed $'s/\033\\[[0-9;]*[[:alpha:]]//g')
          native_args=${native_line#*native-static-libs: }
          read -r -a raw_libs <<< "$native_args"
          native_libs=()
          seen_libs='|'
          for ((i=0; i<${#raw_libs[@]}; i++)); do
            arg=${raw_libs[i]}
            if [[ "$arg" == -framework ]]; then
              ((i+=1))
              framework=${raw_libs[i]:-}
              test -n "$framework"
              key="framework:$framework"
              if [[ "$seen_libs" != *"|$key|"* ]]; then
                native_libs+=(-framework "$framework")
                seen_libs+="$key|"
              fi
            elif [[ "$arg" == -lSystem ]]; then
              # The C++ driver already links libSystem; passing it again warns.
              continue
            elif [[ "$arg" == -l* ]]; then
              if [[ "$seen_libs" != *"|$arg|"* ]]; then
                native_libs+=("$arg")
                seen_libs+="$arg|"
              fi
            else
              echo "Unexpected native-static-libs argument: $arg" >&2
              exit 1
            fi
          done
          mkdir -p static-smoke
          printf 'Static link inputs: %q ' package/lib/libprobe_rs_lib.a "${native_libs[@]}" | tee -a logs/static-link.log
          printf '\n' | tee -a logs/static-link.log
          c++ -std=c++17 -Ipackage/include probe-rs-lib/tests/ffi_smoke.cpp package/lib/libprobe_rs_lib.a "${native_libs[@]}" -o static-smoke/ffi_smoke_static 2>&1 | tee -a logs/static-link.log
          otool -L static-smoke/ffi_smoke_static | tee -a logs/static-link.log
          if otool -L static-smoke/ffi_smoke_static | grep -F 'libprobe_rs_lib.dylib'; then
            echo 'Static smoke test still imports libprobe_rs_lib.dylib' >&2
            exit 1
          fi
          ./static-smoke/ffi_smoke_static 2>&1 | tee -a logs/static-link.log
      - name: Archive macOS artifacts with executable permissions
        run: |
          tar -czf cpp-macos-intel.tar.gz -C package .
          tar -czf tools-macos-intel.tar.gz -C tools .
      - uses: actions/upload-artifact@v7
        with:
          name: cpp-macos-intel
          path: cpp-macos-intel.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: tools-macos-intel
          path: tools-macos-intel.tar.gz
          if-no-files-found: error
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-macos-intel
          path: logs/
          if-no-files-found: ignore

  publish-release:
    needs: [windows-x64, macos-intel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop-cpp-fii'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: cpp-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: tools-*
          path: release-assets
          merge-multiple: true
      - name: Verify release assets and calculate checksums
        shell: bash
        run: |
          set -euo pipefail
          for asset in cpp-windows-x64.zip tools-windows-x64.zip cpp-macos-intel.tar.gz tools-macos-intel.tar.gz; do
            test -s "release-assets/$asset"
          done
          (cd release-assets && sha256sum cpp-* tools-* > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt
      - name: Create tag and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Invalid workspace version: $version" >&2
            exit 1
          fi
          date_utc=$(date -u +%Y%m%d)
          tag="cpp-v${version}-develop-cpp-fii-${date_utc}-g${GITHUB_SHA:0:12}"
          echo "Publishing $tag for $GITHUB_SHA"

          if tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null); then
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag $tag already points to $tag_sha, not $GITHUB_SHA" >&2
              exit 1
            fi
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${GITHUB_SHA}"
          fi

          if gh release view "$tag" --json assets >/dev/null 2>&1; then
            existing_assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
            for asset in release-assets/*; do
              if ! grep -Fxq "$(basename "$asset")" <<< "$existing_assets"; then
                gh release upload "$tag" "$asset"
              fi
            done
          else
            gh release create "$tag" release-assets/* \
              --verify-tag \
              --title "C++ artifacts v${version} (develop-cpp-fii, ${date_utc})" \
              --notes "Automated Windows x64 and Intel Mac build from develop-cpp-fii commit ${GITHUB_SHA}. Includes C++ libraries, CLI tools, and SHA-256 checksums." \
              --latest
          fi
          gh release view "$tag" --json url --jq '.url'
